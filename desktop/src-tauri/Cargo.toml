[package]
name = "ciccio-app"
version = "0.1.2"
description = "Ciccio: la sala controllo degli agenti in una finestra, con le notifiche del sistema"
authors = ["Daniele Costa"]
license = "AGPL-3.0-only"
edition = "2021"
publish = false

[[bin]]
name = "ciccio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
sha2 = "0.10"
hex = "0.4"
# Firma delle release (aggiornamento automatico): solo verifica, senza le tabelle precalcolate.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
url = "2"
open = "5"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Foundation_Collections"] }
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
